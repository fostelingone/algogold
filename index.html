    <style>
        :root {
            --accent-color: #2881cb;
            --accent-hover: #1f6db0;
            --text-primary: #222222;
            --text-secondary: #707579;
            --bg-page: #ffffff;
            --shadow-color: rgba(0, 0, 0, 0.08);
        }

        .dark {
            --text-primary: #ffffff;
            --text-secondary: #aaaaaa;
            --bg-page: #181818;
            --shadow-color: rgba(0, 0, 0, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-page);
            color: var(--text-primary);
            transition: background 0.2s ease, color 0.2s ease;
        }

        /* Background image */
        .bg-image {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: -2;
            background: url('img/3d8c2f2c82c1c9ef1e27be645cd1aa17.jpg') center center / cover no-repeat;
        }

        /* Container */
        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 16px;
        }

        /* Header */
        .header-bar {
            position: relative;
            z-index: 10;
            background: #e8efeb;
        }

        .dark .header-bar {
            background: #2a2f2c;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 56px;
            padding: 12px 24px;
        }

        .tg-logo {
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        .tg-logo svg {
            height: 34px;
            width: auto;
        }

        .header-btn {
            padding: 8px 20px;
            border-radius: 9999px;
            background: var(--accent-color);
            color: white;
            border: none;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s ease;
        }

        .header-btn:hover {
            background: var(--accent-hover);
        }

        /* Main content */
        .main-wrapper {
            position: fixed;
            top: 56px;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-y: auto;
        }

        .page-card {
            position: relative;
            max-width: 440px;
            width: 100%;
            background: var(--bg-page);
            border-radius: 16px;
            box-shadow: 0 4px 24px var(--shadow-color);
            padding: 48px 32px;
            text-align: center;
            animation: fadeInUp 0.4s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Avatar */
        .avatar-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 20px;
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 4px 16px var(--shadow-color);
        }

        /* Title */
        .channel-title {
            font-size: 24px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 24px;
            line-height: 1.3;
        }

        /* Description */
        .channel-description {
            font-size: 15px;
            color: var(--text-secondary);
            line-height: 1.5;
            margin-bottom: 32px;
        }

        /* Join button */
        .join-button {
            display: inline-block;
            padding: 14px 48px;
            border-radius: 9999px;
            background: var(--accent-color);
            color: white;
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 16px rgba(40, 129, 203, 0.3);
            position: relative;
            overflow: hidden;
        }

        .join-button::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 60%;
            height: 100%;
            background: linear-gradient(
                105deg,
                transparent 20%,
                rgba(255, 255, 255, 0) 40%,
                rgba(255, 255, 255, 0.4) 50%,
                rgba(255, 255, 255, 0) 60%,
                transparent 80%
            );
            animation: shine 2.5s ease-in-out infinite;
        }

        @keyframes shine {
            0% { left: -100%; }
            60% { left: 120%; }
            100% { left: 120%; }
        }

        .join-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(40, 129, 203, 0.4);
        }

        .join-button:active {
            transform: translateY(0);
        }

        /* Responsive */
        @media (max-width: 600px) {
            .header {
                padding: 12px 16px;
            }

            .page-card {
                padding: 36px 24px;
            }

            .channel-title {
                font-size: 20px;
            }

            .channel-description {
                font-size: 14px;
            }

            .avatar {
                width: 100px;
                height: 100px;
            }
        }

        @media (max-width: 400px) {
            .page-card {
                padding: 28px 20px;
            }

            .avatar {
                width: 90px;
                height: 90px;
            }

            .channel-title {
                font-size: 18px;
            }
        }
    </style>
